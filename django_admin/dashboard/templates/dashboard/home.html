<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart E-Commerce Admin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Smart E-Commerce Admin Dashboard</h1>
</div>

<div class="container">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h2>Users</h2>
            <p>Manage customers and users.</p>
            <a href="/admin/dashboard/users/">View Users</a>
        </div>

        <div class="card">
            <h2>Products</h2>
            <p>Manage products and stock.</p>
            <a href="/admin/dashboard/products/">View Products</a>
        </div>

        <div class="card">
            <h2>Orders</h2>
            <p>Manage customer orders.</p>
            <a href="/admin/dashboard/orders/">View Orders</a>
        </div>

        <div class="card">
            <h2>Cart</h2>
            <p>View customer cart items.</p>
            <a href="/admin/dashboard/cart/">View Cart</a>
        </div>

    </div>

</div>

</body>
</html>
