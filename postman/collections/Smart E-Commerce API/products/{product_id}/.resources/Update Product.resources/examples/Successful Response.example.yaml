$kind: http-example
request:
  url: "{{baseUrl}}/products/:product_id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    product_id: "7798"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "description": "string",
        "price": 2017.0975156716393,
        "category": "string",
        "stock": 4058,
        "images": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
