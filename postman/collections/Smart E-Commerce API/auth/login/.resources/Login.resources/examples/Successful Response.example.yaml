$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body:
    type: urlencoded
    content:
      username: string
      password: string
      grant_type: password
      scope: ""
      client_id: string
      client_secret: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
