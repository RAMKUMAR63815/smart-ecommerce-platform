$kind: http-request
url: "{{baseUrl}}/products/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "string",
      "description": "string",
      "price": 2417.242864908733,
      "stock": 8879,
      "images": "string"
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Create Product.resources/examples
order: 3000
